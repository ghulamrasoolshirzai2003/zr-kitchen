<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14100c" />
    <title>ZR Kitchen — Fine Dining in Kangar, Perlis</title>
    <meta name="description" content="ZR Kitchen is Kangar's destination for slow-cooked Nasi Briyani, tandoori, hand-torn naan and Malaysian classics — an elegant dining room in Kampung Seriab, Perlis." />
    <meta property="og:title" content="ZR Kitchen — Fine Dining in Kangar, Perlis" />
    <meta property="og:description" content="Slow-cooked Nasi Briyani, tandoori, hand-torn naan and Malaysian classics in Kampung Seriab, Perlis." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      a[href*="netlify.com"],
      #netlify-badge,
      .netlify-badge {
        display: none !important;
      }
    </style>
    <script>
      // Netlify's "Powered by Netlify" badge is injected client-side after
      // load with markup that varies by account/plan, so CSS selectors alone
      // are unreliable — watch the DOM and remove it whenever it appears.
      new MutationObserver(() => {
        document.querySelectorAll('a[href*="netlify.com"]').forEach((el) => el.remove())
      }).observe(document.body, { childList: true, subtree: true })
    </script>
  </body>
</html>
